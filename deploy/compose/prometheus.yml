global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'job-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'worker'
    dns_sd_configs:
      - names:
          - 'worker'
        type: 'A'
        port: 9091

  - job_name: 'results-processor'
    dns_sd_configs:
      - names:
          - 'results-processor'
        type: 'A'
        port: 9092
